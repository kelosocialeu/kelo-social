name: Generate static interface translations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public/locales/fr.json"
      - "scripts/generate-static-interface-locales.mjs"
      - ".github/workflows/static-interface-locales.yml"

permissions:
  contents: write

concurrency:
  group: static-interface-locales
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate locale files
        run: node scripts/generate-static-interface-locales.mjs || true

      - name: Commit generated translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/locales/*.json
          if git diff --cached --quiet; then
            echo "No locale changes to commit."
            exit 0
          fi
          git commit -m "Generate static interface translations"
          git push origin HEAD:main
